<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEBOP Spec Sheet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--red:#e60012;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;--soft:#f4f4f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--soft);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:190px 1fr 390px;grid-template-rows:50px 1fr;height:100vh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 12px;background:#111;color:#fff}
#top .brand{font-weight:900;letter-spacing:-.03em;font-size:17px;margin-right:10px}
#top .brand i{font-style:normal;color:var(--red)}
#top button{background:#262626;border:0;border-radius:6px;padding:7px 11px;color:#fff;cursor:pointer;white-space:nowrap}
#top button:hover{background:#3a3a3a}
#top button.pri{background:var(--red)}
#top .sep{width:1px;height:22px;background:#333;margin:0 4px}
#top .status{margin-left:auto;margin-right:8px;color:#a1a1aa;font-size:12px;white-space:nowrap}
#top .status b{color:#fff}
#pages{overflow:auto;border-right:1px solid var(--line);background:#fafafa;padding:10px}
.pc{border-radius:8px;padding:6px;margin-bottom:8px;cursor:pointer;border:1.5px solid transparent}
.pc:hover{background:#f0f0f1}
.pc.on{border-color:var(--red);background:#fff}
.pc-th{aspect-ratio:16/9;border-radius:4px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.pc-th img{width:100%;height:100%;object-fit:contain}
.pc-th img.cv{object-fit:cover}
.pc-th .tl{font-weight:900;font-size:14px;letter-spacing:-.03em;color:#fff}
.pc-m{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:12px;color:var(--mut)}
.pc-m b{color:var(--ink)}
.pc-act{margin-left:auto;display:none;gap:2px}
.pc:hover .pc-act,.pc.on .pc-act{display:flex}
.pc-act button{border:0;background:#e4e4e7;border-radius:4px;width:20px;height:20px;padding:0;cursor:pointer;font-size:11px}
.addp{display:grid;gap:6px;margin-top:6px}
.addp button{border:1px dashed #a1a1aa;background:#fff;border-radius:8px;padding:9px;cursor:pointer}
.addp button:hover{border-color:var(--red);color:var(--red)}
#stage{position:relative;overflow:hidden;background:#d4d4d8}
#pageWrap{position:absolute;width:1920px;height:1080px;transform-origin:0 0;box-shadow:0 6px 30px rgba(0,0,0,.18)}
#panel{overflow:auto;border-left:1px solid var(--line);background:#fff}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row.wrap{flex-wrap:wrap}
.row>label{width:72px;flex:none;color:var(--mut);font-size:12px}
.row input[type=range]{flex:1;accent-color:var(--red)}
.rv{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.in{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
.in:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
textarea.in{resize:vertical;line-height:1.45}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#a1a1aa}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;background:var(--soft);border-radius:7px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:6px 6px;cursor:pointer;font-size:12px;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.hint{color:var(--mut);font-size:12px;line-height:1.5;margin:8px 0 0}
.stat{font-size:12px;color:var(--mut);margin-top:6px}
.warn{background:#fff1f2;color:#be123c;border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.45;margin:8px 0}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);flex:none}
.mut{color:var(--mut);font-size:12px}
.chk{display:flex;align-items:center;gap:7px;margin:7px 0;cursor:pointer}
.chk input{accent-color:var(--red)}
input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:5px;padding:1px;background:#fff;cursor:pointer}
.plist{margin-top:8px}
.prow{border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:6px;background:#fff}
.prow.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.prow.dropB{box-shadow:inset 0 3px 0 var(--red)}
.prow.dropA{box-shadow:inset 0 -3px 0 var(--red)}
.prow.dragging{opacity:.4}
.prow-h{display:flex;align-items:center;gap:6px}
.prow-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:4px 0}
.prow .in{padding:4px 6px;font-size:12px}
.prow-h .in{font-weight:700}
.grip{cursor:grab;color:#a1a1aa;font-size:14px;padding:0 2px;user-select:none}
.dot{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.ib{border:0;background:var(--soft);border-radius:5px;width:24px;height:24px;cursor:pointer;flex:none;padding:0}
.ib:hover{background:#e4e4e7}
.chg{font-size:10px;color:#fff;background:#f59e0b;border-radius:4px;padding:1px 5px;flex:none}
.rrow{display:flex;gap:6px;align-items:flex-start;margin:6px 0}
.rthumb{width:34px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:var(--mut)}
/* ---- page ---- */
.page{width:1920px;height:1080px;position:relative;overflow:hidden;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;user-select:none}
.page img{-webkit-user-drag:none;user-select:none}
.logo-t{font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.pg-conf{position:absolute;right:58px;top:26px;color:var(--red);font-weight:800;font-size:58px;letter-spacing:.005em}
.pg-foot{position:absolute;left:62px;right:62px;bottom:34px;height:34px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px;letter-spacing:.06em}
.pg-foot .num{position:absolute;left:50%;transform:translateX(-50%);letter-spacing:0;font-size:17px}
.pg-foot .flogo{display:flex;align-items:center}
.pg-title{position:absolute;left:62px;top:40px;font-size:40px;font-weight:800;letter-spacing:-.01em}
.pg-list{position:absolute;left:62px;column-gap:36px;column-fill:auto;overflow:hidden}
.li{break-inside:avoid;padding-bottom:24px}
.li-h{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;margin-bottom:5px}
.li-dot{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-size:17px;font-weight:700;display:grid;place-items:center;flex:none}
.li-b{padding-left:44px;font-size:18.5px;line-height:1.6;font-weight:500}
.li.on .li-h span:last-child{box-shadow:inset 0 -6px 0 rgba(230,0,18,.25)}
.li .rev{color:var(--red);font-size:16px}
.cap,.det{position:absolute;pointer-events:none}
.det{image-rendering:pixelated;opacity:.95}
.dropz{position:absolute;border:3px dashed #a1a1aa;border-radius:18px;display:grid;place-items:center;text-align:center;color:#71717a;font-size:24px;line-height:1.6;cursor:pointer;background:rgba(255,255,255,.35)}
.dropz:hover{border-color:var(--red);color:var(--red)}
.ref{position:absolute}
.ref img{display:block;width:100%;object-fit:cover}
.ref-text{white-space:pre-wrap;font-size:19px;font-weight:700;line-height:1.5;overflow:hidden}
.ref-cap{font-size:19px;font-weight:700;margin-top:8px;white-space:pre-wrap}
.ref-rs,.ref-x{display:none}
.inter .ref{cursor:move}
.inter .ref:hover,.inter .ref.on{outline:2px dashed var(--red);outline-offset:4px}
.inter .ref:hover .ref-rs,.inter .ref.on .ref-rs{display:block;position:absolute;right:-12px;bottom:-12px;width:20px;height:20px;background:#fff;border:3px solid var(--red);border-radius:4px;cursor:nwse-resize}
.inter .ref:hover .ref-x,.inter .ref.on .ref-x{display:grid;place-items:center;position:absolute;right:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;cursor:pointer;padding:0}
.mk-layer,.lasso{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}
.inter .mk{pointer-events:auto;cursor:grab}
.mk.on circle{stroke:#111;stroke-width:3}
.anc{pointer-events:auto;cursor:move}
.inter .li{cursor:pointer}
#pageWrap.t-lasso .page,#pageWrap.t-add .page,#pageWrap.t-pick .page{cursor:crosshair}
#pageWrap.t-move .page{cursor:move}
.cv-logo{position:absolute;inset:0;display:grid;place-items:center}
.cv-foot{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-size:26px;font-weight:700;letter-spacing:.03em;word-spacing:.25em}
.cl-contact{position:absolute;left:108px;bottom:96px;font-size:40px;line-height:1.55;font-weight:500}
.cl-logo{position:absolute;right:108px;bottom:96px}
.rimg{position:absolute;inset:0;width:100%;height:100%}
/* ---- modal, toast ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:12px;width:min(560px,92vw);max-height:88vh;overflow:auto;padding:20px 22px}
.mbox h2{margin:0 0 14px;font-size:17px}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.mbox .row>label{width:110px}
table.hist{width:100%;border-collapse:collapse;font-size:12px}
table.hist td,table.hist th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:#333;border:0;color:#fff;border-radius:5px;padding:4px 9px;cursor:pointer}
#print{display:none}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{background:#fff;height:auto}
  #app,#modal,.toast{display:none!important}
  #print{display:block!important}
  #print .page{break-after:page;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="brand">BEBOP<i>.</i> Spec</span>
    <button id="bNew">새 문서</button>
    <button id="bOpen">열기</button>
    <button id="bSave">저장</button>
    <button id="bSaveAs">다른 이름으로</button>
    <span class="sep"></span>
    <button id="bUndo" title="실행 취소 (Ctrl+Z)">↶</button>
    <button id="bRedo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
    <span class="status" id="status"></span>
    <button id="bHist">전달 기록</button>
    <button id="bDeliver">전달 완료 기록</button>
    <button id="bSet">문서 설정</button>
    <button id="bPdf" class="pri">PDF 출력</button>
  </header>
  <aside id="pages"></aside>
  <main id="stage"><div id="pageWrap"></div></main>
  <aside id="panel"></aside>
</div>
<div id="print"></div>
<div id="modal" hidden></div>
<datalist id="dl-color"></datalist><datalist id="dl-mat"></datalist><datalist id="dl-fin"></datalist>

<script>
'use strict';
/* =========================================================
   BEBOP Spec Sheet — 목업 견적용 시방서 제작 툴
   - 모든 처리는 브라우저 안에서만 이루어집니다 (서버 전송 없음)
   ========================================================= */

// ---------- utils ----------
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
function todayStr(){ const d = new Date(); return `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`; }
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v === false || v == null) continue;
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs = {}){ const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; }
function hexToRgb(h){ h = (h || '#ffffff').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(a){ return '#' + a.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function isDark(hex){ const [r, g, b] = hexToRgb(hex); return 0.299*r + 0.587*g + 0.114*b < 140; }
function hsl(h, s, l){ s /= 100; l /= 100; const k = n => (n + h/30) % 12; const a = s*Math.min(l, 1-l); const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1))); return [f(0)*255, f(8)*255, f(4)*255]; }
function readURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function pickFile(accept, multiple = false){ return new Promise(res => { const i = el('input', { type: 'file', accept }); i.multiple = multiple; i.onchange = () => res([...i.files]); i.click(); }); }
function download(blob, name){ const a = el('a', { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
let toastT;
function toast(msg, actions = []){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('div', { class: 'toast' }, msg, actions.map(([l, fn]) => el('button', { onclick: () => { t.remove(); fn(); } }, l)));
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), actions.length ? 9000 : 3200);
}

// ---------- state ----------
const TYPE_LABEL = { cover: '표지', render: '렌더', spec: '시방서', closing: '마무리' };
const MR = 20; // 마커 반지름(px, 1920 기준)
function defMeta(){ return {
  project: 'BEBOP DESIGN PROJECT', docType: 'MOCK UP', date: todayStr(), fileBase: 'bebop-{date}-mockup',
  pageBg: '#e4e4e4', coverBg: '#000000', confidential: true, specFormat: 'stack', showRevMarks: false,
  contact1: 'soohun@bebop.kr / rich@bebop.kr', contact2: '1F, 27, Toegye-ro 86ga-gil, Jung-gu, Seoul, Korea',
  logoId: null, version: 0, deliveries: [], snapshot: null
}; }
function newSpecPage(){ return {
  id: uid(), type: 'spec', title: '', bg: '', startNum: 1, imageId: null, nw: 0, nh: 0, box: null,
  det: { bg: null, autoBg: null, tol: 26, merge: 4, minArea: 60, knockout: false },
  objects: [], groups: [], excluded: [], manual: [], parts: [], refs: [], listW: 760, listCols: 2, order: 'row', rowTol: 0.6
}; }
let S, IMG = {}, cur = 0, scale = 0.5;
const ui = { tool: 'select', sel: new Set(), selPart: null, showDet: true, selRef: null };
const RT = {}, RTp = {}; const imgCache = new Map(), cleanCache = new Map(), cleanReady = new Map();
let fileHandle = null;
const undoS = [], redoS = [];

function freshDoc(){
  S = { meta: defMeta(), pages: [ { id: uid(), type: 'cover' }, newSpecPage(), { id: uid(), type: 'closing' } ] };
  IMG = {}; cur = 1; fileHandle = null; resetCaches(); undoS.length = 0; redoS.length = 0;
}
function resetCaches(){ for (const k in RT) delete RT[k]; for (const k in RTp) delete RTp[k]; imgCache.clear(); cleanCache.clear(); cleanReady.clear(); ui.sel.clear(); ui.selPart = null; ui.selRef = null; }
const curPage = () => S.pages[cur];
function pageBg(p){ return (p.type === 'cover' || p.type === 'closing') ? S.meta.coverBg : (p.bg || S.meta.pageBg); }
function addImage(url){ const id = 'i' + uid(); IMG[id] = url; return id; }
function getImg(id){
  if (!imgCache.has(id)) imgCache.set(id, new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = IMG[id]; }));
  return imgCache.get(id);
}

// ---------- undo / autosave ----------
function commit(){ undoS.push(JSON.stringify(S)); if (undoS.length > 60) undoS.shift(); redoS.length = 0; dirty(); }
function undo(){ if (!undoS.length) return; redoS.push(JSON.stringify(S)); S = JSON.parse(undoS.pop()); cur = Math.min(cur, S.pages.length - 1); ui.sel.clear(); renderAll(); dirty(); }
function redo(){ if (!redoS.length) return; undoS.push(JSON.stringify(S)); S = JSON.parse(redoS.pop()); cur = Math.min(cur, S.pages.length - 1); ui.sel.clear(); renderAll(); dirty(); }
const idb = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open('bebop-spec', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(r.result); }; r.onerror = () => rej(r.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv'); const q = t.objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};
let asT;
function dirty(){ clearTimeout(asT); asT = setTimeout(() => { try { idb.set('draft', serialize()).catch(() => {}); } catch(e){} }, 1500); updateTop(); }

// ---------- file naming / save / open ----------
function yymmdd(){ const d = (S.meta.date || '').replace(/\D/g, ''); return d.length >= 8 ? d.slice(2, 8) : d; }
function fileBase(){ return (S.meta.fileBase || 'bebop-{date}-mockup').replace('{date}', yymmdd()).replace('{v}', 'v' + pad2(S.meta.version || 0)); }
function jsonName(){ return fileBase() + (S.meta.version ? `_v${pad2(S.meta.version)}` : '') + '.spec.json'; }
function usedImages(){
  const used = new Set();
  S.pages.forEach(p => { if (p.imageId) used.add(p.imageId); (p.refs || []).forEach(r => r.imageId && used.add(r.imageId)); });
  if (S.meta.logoId) used.add(S.meta.logoId);
  const o = {}; used.forEach(id => { if (IMG[id]) o[id] = IMG[id]; }); return o;
}
function serialize(){ return JSON.stringify({ format: 'bebop-spec', schema: 1, savedAt: new Date().toISOString(), meta: S.meta, pages: S.pages, images: usedImages() }); }
async function save(as){
  const blob = new Blob([serialize()], { type: 'application/json' });
  if (window.showSaveFilePicker){
    try {
      if (!fileHandle || as) fileHandle = await window.showSaveFilePicker({ suggestedName: jsonName(), types: [{ description: 'BEBOP 시방서 프로젝트', accept: { 'application/json': ['.json'] } }] });
      const w = await fileHandle.createWritable(); await w.write(blob); await w.close();
      toast('저장했어요 · ' + fileHandle.name); return true;
    } catch (err){ if (err.name === 'AbortError') return false; fileHandle = null; }
  }
  download(blob, jsonName()); toast('프로젝트 파일을 다운로드했어요. 클라우드 전달 폴더로 옮겨 두세요.'); return true;
}
function loadDoc(obj){
  if (!obj || obj.format !== 'bebop-spec') throw new Error('BEBOP 시방서 파일이 아니에요');
  S = { meta: { ...defMeta(), ...obj.meta }, pages: obj.pages };
  IMG = obj.images || {}; resetCaches(); undoS.length = 0; redoS.length = 0;
  cur = Math.min(1, S.pages.length - 1);
}
async function openDoc(){
  try {
    let file;
    if (window.showOpenFilePicker){
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'BEBOP 시방서 프로젝트', accept: { 'application/json': ['.json'] } }] });
      file = await h.getFile(); fileHandle = h;
    } else { [file] = await pickFile('.json,application/json'); fileHandle = null; }
    if (!file) return;
    const h = fileHandle; loadDoc(JSON.parse(await file.text())); fileHandle = h;
    renderAll(); toast('열었어요 · ' + file.name);
  } catch (err){ if (err.name !== 'AbortError') toast('열 수 없어요: ' + err.message); }
}

function drawOverlay(canvas, p, r){

    if (o.id > n + 1) continue;

    const b = [Math.min(...os.map(o => o.bbox[0])), Math.min(...os.map(o => o.bbox[1])), Math.max(...os.map(o => o.bbox[2])), Math.max(...os.map(o => o.bbox[3]))];
    const [R, G, B] = hsl((gi*67 + 200) % 360, 75, 42); ctx.strokeStyle = `rgb(${R|0},${G|0},${B|0})`;
    ctx.strokeRect(b[0]*r.k - 3*lw, b[1]*r.k - 3*lw, (b[2]-b[0])*r.k + 6*lw, (b[3]-b[1])*r.k + 6*lw);
  });
  ctx.setLineDash([]);

}

function openDeliver(){
  const ch = changedSet(), next = (S.meta.version || 0) + 1, d = { to: '', date: todayStr(), memo: '' };
  const summary = !S.meta.snapshot ? '첫 전달 기록이에요.' : `지난 전달(v${pad2(S.meta.version)}) 이후 변경 ${ch.size}건${ch.removed ? `, 삭제 ${ch.removed}건` : ''}.`;
  openModal(`전달 완료 기록 — v${pad2(next)}`, el('div', {},
    row('전달처', inp(d, 'to', { ph: '목업 업체명', onInput: () => {} })),
    row('전달일', inp(d, 'date', { onInput: () => {} })),
    row('메모', inp(d, 'memo', { multi: true, ph: '예: 다리 가동부 소재 변경 반영', onInput: () => {} })),
    el('p', { class: 'hint' }, summary + ' 기록하면 지금 상태가 다음 비교 기준이 되고, 새 버전 이름으로 프로젝트 파일을 저장해요. 그다음 PDF 출력으로 전달용 PDF를 같은 폴더에 저장하세요.')),
    [btn('취소', closeModal), btn('기록하고 저장', async () => {
      undoS.push(JSON.stringify(S));
      S.meta.deliveries.push({ v: next, to: d.to, date: d.date, memo: d.memo, changed: ch ? ch.size : null, removed: ch ? ch.removed : null, at: new Date().toISOString() });
      S.meta.version = next; S.meta.snapshot = specSnapshot(); closeModal(); renderAll(); dirty();
      const ok = await save(true); if (ok) toast(`v${pad2(next)} 기록 완료`, [['PDF 출력', printPdf]]);
    }, 'pri')]);
}
function openHistory(){
  const ds = S.meta.deliveries || [];
  openModal('전달 기록', ds.length ? el('table', { class: 'hist' },
    el('tr', {}, el('th', {}, '버전'), el('th', {}, '전달일'), el('th', {}, '전달처'), el('th', {}, '변경'), el('th', {}, '메모')),
    [...ds].reverse().map(x => el('tr', {}, el('td', {}, 'v' + pad2(x.v)), el('td', {}, x.date), el('td', {}, x.to || '—'),
      el('td', {}, x.changed == null ? '첫 전달' : `${x.changed}건${x.removed ? ` / 삭제 ${x.removed}` : ''}`), el('td', { style: { whiteSpace: 'pre-wrap' } }, x.memo || ''))))
    : el('p', { class: 'hint' }, '아직 전달 기록이 없어요. 업체에 보낸 뒤 "전달 완료 기록"을 눌러 주세요.'),
    [btn('닫기', closeModal, 'pri')]);
}

// ---------- PDF ----------
async function printPdf(){
  const host = $('#print'); host.replaceChildren();
  await Promise.all(S.pages.filter(p => p.type === 'spec' && p.imageId && p.det.knockout && (p.det.bg || p.det.autoBg)).map(ensureClean));
  S.pages.forEach((p, i) => host.append(buildPage(p, i, false)));
  await Promise.all([...host.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  try { await document.fonts.ready; } catch(e){}
  const old = document.title; document.title = fileBase();
  window.print();
  document.title = old;
}
window.addEventListener('afterprint', () => $('#print').replaceChildren());

// ---------- global events ----------
$('#pageWrap').addEventListener('pointerdown', onDown);
$('#bNew').onclick = () => { if (!confirm('새 문서를 시작할까요? 저장하지 않은 내용은 사라져요.')) return; freshDoc(); renderAll(); };
$('#bOpen').onclick = openDoc;
$('#bSave').onclick = () => save(false);
$('#bSaveAs').onclick = () => save(true);
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bSet').onclick = openSettings;
$('#bDeliver').onclick = openDeliver;
$('#bHist').onclick = openHistory;
$('#bPdf').onclick = printPdf;
window.addEventListener('resize', layout);
const stage = $('#stage');
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => {
  e.preventDefault();
  const fs = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')); if (!fs.length) return;
  const p = curPage();
  if (p.type === 'spec') setCapture(p, fs[0]); else if (p.type === 'render') setRenderImg(p, fs[0]); else addRenderPages(fs);
});
document.addEventListener('paste', e => {
  const tag = document.activeElement && document.activeElement.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/')); if (!item) return;
  const f = item.getAsFile(), p = curPage(); e.preventDefault();
  if (p.type === 'spec') setCapture(p, f); else if (p.type === 'render') setRenderImg(p, f); else addRenderPages([f]);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's'){ e.preventDefault(); save(e.shiftKey); return; }
  if (mod && (k === 'z' || k === 'y')){ if (typing) return; e.preventDefault(); (k === 'y' || e.shiftKey) ? redo() : undo(); return; }
  if (typing || mod || !$('#modal').hidden) return;
  const p = curPage(); if (!p || p.type !== 'spec') return;
  if (k === 'v') setTool('select'); else if (k === 'l') setTool('lasso'); else if (k === 'a') setTool('add'); else if (k === 'm') setTool('move');
  else if (k === 'g') groupSel();
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); if (ui.sel.size) excludeSel(); else if (ui.selPart) deletePart(p, ui.selPart); }
  else if (k === 'escape'){ ui.sel.clear(); ui.selPart = null; ui.selRef = null; if (ui.tool === 'pick') ui.tool = 'select'; renderAll(); }
});

// ---------- boot ----------
(async function boot(){
  freshDoc();
  try {
    const d = await idb.get('draft');
    if (d){ loadDoc(JSON.parse(d)); setTimeout(() => toast('마지막 작업을 이어서 불러왔어요', [['새 문서로 시작', () => { freshDoc(); renderAll(); }]]), 300); }
  } catch(e){ freshDoc(); }
  layout(); renderAll();
})();
</script>
</body>
