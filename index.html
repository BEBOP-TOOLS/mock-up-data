<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEBOP Spec Sheet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--red:#e60012;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;--soft:#f4f4f5;--fill:#ededef;--fill2:#e2e2e5;
  --ui:"Maax Mono","DM Mono",ui-monospace,Menlo,monospace;--lw:220px;--rw:390px}
/* Maax Mono: 설치돼 있으면 시스템 폰트를, 아니면 fonts/ 폴더의 파일을 씀 */
@font-face{font-family:"Maax Mono";font-weight:400;src:local("Maax Mono"),local("MaaxMono-Regular"),url(fonts/MaaxMono-Regular.woff2) format("woff2"),url(fonts/MaaxMono-Regular.otf) format("opentype")}
@font-face{font-family:"Maax Mono";font-weight:700;src:local("Maax Mono Bold"),local("MaaxMono-Bold"),url(fonts/MaaxMono-Bold.woff2) format("woff2"),url(fonts/MaaxMono-Bold.otf) format("opentype")}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--ui);color:var(--ink);background:var(--soft);font-size:12px;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
#app{position:relative;display:grid;grid-template-columns:var(--lw) 1fr var(--rw);height:100vh}
.rz{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;cursor:col-resize;z-index:8}
.rz::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.rz:hover::after,.rz.on::after{background:var(--red)}
#rzL{left:var(--lw)}
#rzR{left:calc(100% - var(--rw))}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing #stage{pointer-events:none}
/* toolbar on the stage */
#tools{position:absolute;left:16px;right:16px;top:12px;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
#tools>*{pointer-events:auto}
#tools .gap{flex:1;pointer-events:none}
.tg{display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:10px}
.tb{height:30px;min-width:30px;border:0;border-radius:7px;background:transparent;color:var(--ink);padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tb:hover{background:#fff}
.tb.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tb:disabled{opacity:.3;cursor:default;background:transparent}
.tb.ic{padding:0;width:30px}
.tb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* page list */
#pages{overflow:auto;background:#fafafa;padding:12px;border-right:1px solid var(--line)}
.pc{border-radius:10px;padding:6px;margin-bottom:6px;cursor:pointer;border:1.5px solid transparent}
.pc:hover{background:var(--fill)}
.pc.on{border-color:var(--red);background:#fff}
.pc{position:relative}
.pc[draggable=true]{cursor:grab}
.pc.dragging{opacity:.35}
.pc.dropB::before,.pc.dropA::after{content:"";position:absolute;left:6px;right:6px;height:3px;border-radius:2px;background:var(--red)}
.pc.dropB::before{top:-5px}
.pc.dropA::after{bottom:-5px}
.pc-th{position:relative;aspect-ratio:16/9;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.pc-th .page{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--ts,.08));pointer-events:none}
.pc-m{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:22px;color:var(--mut)}
.pc-m b{color:var(--ink);font-weight:400}
.pc-del{margin-left:auto;border:0;background:transparent;border-radius:6px;width:24px;height:24px;padding:0;cursor:pointer;color:var(--mut);display:grid;place-items:center;visibility:hidden}
.pc:hover .pc-del{visibility:visible}
.pc-del:hover{background:var(--fill2);color:var(--red)}
.pc-del svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.addp{display:grid;gap:6px;margin-top:8px}
.addp button{border:0;background:var(--fill);border-radius:10px;padding:11px 10px;cursor:pointer;text-align:left}
.addp button:hover{background:var(--fill2)}
/* stage */
#stage{position:relative;overflow:hidden;background:#d4d4d8}
#pageWrap{position:absolute;width:1920px;height:1080px;transform-origin:0 0;box-shadow:0 6px 30px rgba(0,0,0,.18)}
#present{position:fixed;inset:0;background:#000;z-index:100;overflow:hidden;cursor:none}
#present[hidden]{display:none}
#presWrap{position:absolute;width:1920px;height:1080px;transform-origin:0 0}
/* panel */
#panel{overflow:auto;background:#fff;border-left:1px solid var(--line)}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec h3{display:flex;align-items:center;margin:0 0 12px;font-size:12px;font-weight:400;color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.info{position:relative;margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--fill);color:var(--mut);display:grid;place-items:center;font-size:10px;text-transform:none;cursor:help;flex:none}
.info:hover{background:var(--fill2);color:var(--ink)}
.info .tip{display:none;position:absolute;right:0;top:24px;width:260px;background:var(--ink);color:#fff;padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.6;letter-spacing:0;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.info .tip p{margin:0}.info .tip p+p{margin-top:6px}
.info:hover .tip{display:block}
.sec h3 i{font-style:normal;color:var(--mut);margin-right:8px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row.wrap{flex-wrap:wrap}
.row>label{width:84px;flex:none;color:var(--mut)}
.row input[type=range]{flex:1;accent-color:var(--ink);min-width:0}
.rv{width:50px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.in{width:100%;border:1px solid transparent;border-radius:7px;padding:7px 9px;background:var(--fill);min-width:0}
.in:hover{background:var(--fill2)}
.in:focus{outline:none;background:#fff;border-color:var(--red)}
.in::placeholder{color:#a1a1aa}
textarea.in{resize:vertical;line-height:1.45}
.btn{border:0;background:var(--fill);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--fill2)}
.btn.pri{background:var(--fill2)}
.btn.pri:hover{background:#d4d4d8}
.btn:disabled{opacity:.4;cursor:default;background:var(--fill)}
.btn.icon{padding:0;width:34px;height:34px;display:grid;place-items:center;flex:none}
.btn.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.file{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:8px;height:34px;padding:0 4px 0 11px}
.file .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.file .fname:hover{text-decoration:underline}
.file .ib{background:transparent}
.file .ib:hover{background:var(--fill2)}
.seg.ico{flex:none}
.row.nw{flex-wrap:nowrap}
.tbox{display:inline-flex;flex-direction:column;max-width:100%}
.selact{margin-left:auto;display:flex;align-items:center;gap:6px}
.selact .mut{font-size:11px;margin-right:2px;white-space:nowrap}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;line-height:1;padding:5px 7px;border-radius:6px;white-space:nowrap;z-index:40;pointer-events:none;letter-spacing:0;text-transform:none}
.seg.ico button{width:34px;padding:5px 0;display:grid;place-items:center}
.seg.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.ptog{width:100%;display:flex;justify-content:space-between;margin-top:10px}
.updn{display:grid;grid-template-rows:1fr 1fr;gap:1px;flex:none}
.updn button{border:0;background:var(--fill);width:22px;height:12px;padding:0;font-size:7px;line-height:1;cursor:pointer;color:var(--mut)}
.updn button:first-child{border-radius:5px 5px 0 0}.updn button:last-child{border-radius:0 0 5px 5px}
.updn button:hover:not(:disabled){background:var(--fill2);color:var(--ink)}
.updn button:disabled{opacity:.35;cursor:default}
.addnote{padding:4px 9px;font-size:11px;background:transparent;color:var(--mut)}
.addnote:hover{background:var(--fill)}
.pfx{display:flex;align-items:center;background:#fff;border-radius:7px;min-width:0;padding-left:7px;border:1px solid transparent}
.pfx span{color:var(--mut);font-size:11px;flex:none}
.pfx .in{padding-left:4px!important}
.pfx:focus-within{border-color:var(--red)}
.pfx .in:focus{border-color:transparent}
.addpart{width:100%;margin-top:6px;padding:10px;text-align:left}
.addpart.on{background:var(--ink);color:#fff}
.grps{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:2px 0 6px;color:var(--mut);font-size:11px}
.grps span{margin-right:4px}
.gchip{border:0;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--fill);font-size:11px;cursor:pointer}
.gchip:hover{background:var(--fill2)}
.gchip.on{background:var(--red);color:#fff}
.grps .cnt{margin-right:0}
.gact{border:0;height:22px;padding:0 9px;border-radius:11px;background:var(--ink);color:#fff;font-size:11px;cursor:pointer;margin-left:2px}
.gref{border:0;width:22px;height:22px;border-radius:11px;background:var(--fill);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--mut)}
.gref:hover{background:var(--fill2);color:var(--ink)}
.gref svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg.ico svg{stroke-linejoin:round}
#pageWrap.t-brush .page{cursor:crosshair}
.ordbar{display:flex;align-items:center;gap:6px;margin:8px 0;padding:8px 8px 8px 12px;border-radius:9px;background:#fff1f2;color:#be123c}
.ordbar span{flex:1}
#pageWrap.t-order .page{cursor:pointer}
.pthumb{width:34px;height:34px;border-radius:6px;background:#fff;object-fit:contain;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sec h3.tog{cursor:pointer;user-select:none}
.sec h3 .caret{margin-left:auto;color:var(--mut);text-transform:none;font-size:14px;line-height:1}
.sec h3.tog:hover .caret{color:var(--ink)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;flex:1}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 6px;cursor:pointer;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.6)}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.3;cursor:default;background:transparent}
.hint{color:var(--mut);font-size:11px;line-height:1.6;margin:10px 0 0}
.sec h3 .hint{display:none}
.stat{font-size:11px;color:var(--mut);margin-top:8px}
.warn{background:#fff1f2;color:#be123c;border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.5;margin:8px 0}
.sw{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);flex:none}
.mut{color:var(--mut)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
.chk input{accent-color:var(--ink)}
input[type=color]{width:32px;height:30px;border:0;border-radius:7px;padding:3px;background:var(--fill);cursor:pointer;flex:none}
.plist{margin-top:10px}
.prow{border:1.5px solid transparent;border-radius:10px;padding:8px;margin-bottom:6px;background:#f7f7f8}
.prow.on{border-color:var(--red);background:#fff}
.prow.dropB{box-shadow:inset 0 3px 0 var(--red)}
.prow.dropA{box-shadow:inset 0 -3px 0 var(--red)}
.prow.dragging{opacity:.4}
.prow-h{display:flex;align-items:center;gap:6px}
.prow-g{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px;margin:4px 0}
.prow-g .pfx{grid-column:1/-1}
.prow .in{padding:5px 7px;background:#fff}
.prow .in:focus{border-color:var(--red)}
.grip{cursor:grab;color:#a1a1aa;font-size:14px;padding:0 2px;user-select:none}
.dot{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;flex:none}
.ib{border:0;background:var(--fill);border-radius:6px;width:24px;height:24px;cursor:pointer;flex:none;padding:0}
.ib:hover{background:var(--fill2)}
.rrow{display:flex;gap:6px;align-items:flex-start;margin:6px 0}
.rthumb{width:34px;height:34px;object-fit:cover;border-radius:6px;background:var(--fill);flex:none;display:grid;place-items:center;color:var(--mut)}
/* ---- page ---- */
.page{width:1920px;height:1080px;position:relative;overflow:hidden;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;user-select:none}
.page img{-webkit-user-drag:none;user-select:none}
.logo-t{font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.pg-conf{position:absolute;right:58px;top:26px;color:var(--red);font-weight:800;font-size:58px;letter-spacing:.005em}
.pg-foot{position:absolute;left:62px;right:62px;bottom:34px;height:34px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px;letter-spacing:.06em}
.pg-foot .num{position:absolute;left:50%;transform:translateX(-50%);letter-spacing:0;font-size:17px}
.pg-foot .flogo{display:flex;align-items:center}
.pg-title{position:absolute;left:62px;top:40px;font-size:40px;font-weight:800;letter-spacing:-.01em}
.pg-list{position:absolute;left:62px;column-gap:var(--gap,36px);column-fill:auto;overflow:hidden;--ls:1}
.li{break-inside:avoid;padding-bottom:calc(22px*var(--ls));white-space:nowrap}
.li-h{display:flex;align-items:center;gap:calc(12px*var(--ls));min-width:0;font-size:calc(22px*var(--ls));font-weight:700;margin-bottom:calc(4px*var(--ls))}
.li-dot{width:calc(22px*var(--ls));height:calc(22px*var(--ls));border-radius:50%;background:var(--red);color:#fff;font-size:calc(13px*var(--ls));font-weight:700;display:grid;place-items:center;flex:none}
.li-b{padding-left:calc(34px*var(--ls));font-size:calc(18.5px*var(--ls));line-height:1.6;font-weight:500}
.li.on .li-h>:last-child{box-shadow:inset 0 -6px 0 rgba(230,0,18,.25)}
.li .ed{margin:0 -4px;padding:0 4px}
.li .ed.inl{display:inline-block;margin:0;padding:0 3px;min-width:1em}
.li .pline:has(.ed:empty) .pfix,.li div:has(>.ed.inl:empty)>.sep{opacity:.35}
.li .note{white-space:pre-wrap}
.page.solo .li.dim{opacity:.22}
.page.solo .mk.dim{opacity:.25}
.page.solo .det{display:none}
.solo-cv{position:absolute;pointer-events:none}
.li .ghost{opacity:.3}
.cap,.det{position:absolute;pointer-events:none}
.det{image-rendering:pixelated;opacity:.95}
.dropz{position:absolute;border-radius:24px;display:grid;place-items:center;text-align:center;color:#71717a;font-size:24px;line-height:1.6;cursor:pointer;background:rgba(0,0,0,.05);font-family:var(--ui)}
.dropz:hover{background:rgba(0,0,0,.08);color:var(--ink)}
.ref{position:absolute}
.ref img{display:block;width:100%;object-fit:cover}
.ref-text{white-space:pre-wrap;font-size:19px;font-weight:700;line-height:1.5;overflow:hidden}
.ref-cap{font-size:19px;font-weight:700;margin-top:8px;white-space:pre-wrap}
.ref-rs,.ref-x{display:none}
.inter .ref{cursor:move}
.inter .ref:hover,.inter .ref.on{outline:2px dashed var(--red);outline-offset:4px}
.inter .ref:hover .ref-rs,.inter .ref.on .ref-rs{display:block;position:absolute;right:-12px;bottom:-12px;width:20px;height:20px;background:#fff;border:3px solid var(--red);border-radius:4px;cursor:nwse-resize}
.inter .ref:hover .ref-x,.inter .ref.on .ref-x{display:grid;place-items:center;position:absolute;right:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;cursor:pointer;padding:0}
.mk-layer,.lasso{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}
.inter .mk{pointer-events:auto;cursor:grab}
.mk.on circle{stroke:#111;stroke-width:2}
.anc{pointer-events:auto;cursor:move}
.inter .li{cursor:pointer}
#pageWrap.t-brush .page,#pageWrap.t-add .page{cursor:crosshair}
#pageWrap.t-move .page{cursor:move}
.cv-logo{position:absolute;inset:0;display:grid;place-items:center}
.inter [contenteditable]{outline:none;border-radius:6px;cursor:text;user-select:text}
.inter [contenteditable]:hover{box-shadow:0 0 0 2px rgba(161,161,170,.6)}
.inter [contenteditable]:focus{box-shadow:0 0 0 2px var(--red)}
.inter [contenteditable]:empty::before{content:attr(data-ph);opacity:.35}
.inter .pg-title{min-width:300px;padding:0 6px;margin-left:-6px}
.inter .cv-foot span[contenteditable]{padding:2px 6px}
.cv-foot{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-size:26px;font-weight:700;letter-spacing:.03em;word-spacing:.25em}
.cl-contact{position:absolute;left:108px;bottom:96px;font-size:40px;line-height:1.55;font-weight:500}
.cl-logo{position:absolute;right:108px;bottom:96px}
.rimg{position:absolute;max-width:none}
.inter .rimg{cursor:grab}
.inter .rimg:active{cursor:grabbing}
/* ---- popover, toast ---- */
#pop{position:fixed;z-index:50;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);padding:14px;width:256px}
#pop .sws-h{color:var(--mut);font-size:11px;margin-top:10px}
#pop .sws{flex-wrap:wrap}
#pop[hidden]{display:none}
#pop .pop-h{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px}
#pop .sws{display:flex;gap:6px;margin:8px 0}
#pop .sws button{width:24px;height:24px;border-radius:6px;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);cursor:pointer;padding:0}
#pop .sws button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:#333;border:0;color:#fff;border-radius:5px;padding:4px 9px;cursor:pointer}
#print{display:none}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{background:#fff;height:auto}
  #app,#pop,.toast{display:none!important}
  #print{display:block!important}
  #print .page{break-after:page;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <aside id="pages"></aside>
  <main id="stage">
    <div id="tools">
      <div class="tg">
        <button class="tb" id="bFull" title="Fullscreen (F) · ←/→ to move · Esc to exit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fullscreen</button>
      </div>
      <span class="gap"></span>
      <div class="tg">
        <button class="tb" id="bNew" title="New document">New</button>
        <button class="tb" id="bSave" title="Save (⌘S) · Save as ⇧⌘S · Open ⌘O or drop a .json file">Save</button>
        <button class="tb" id="bPdf" title="Export PDF">Export</button>
      </div>
    </div>
    <div id="pageWrap"></div>
  </main>
  <aside id="panel"></aside>
  <div class="rz" id="rzL" title="Drag to resize"></div>
  <div class="rz" id="rzR" title="Drag to resize"></div>
</div>
<div id="print"></div>
<div id="pop" hidden></div>
<div id="present" hidden><div id="presWrap"></div></div>
<datalist id="dl-color"></datalist><datalist id="dl-mat"></datalist><datalist id="dl-fin"></datalist>

<script>
'use strict';
/* =========================================================
   BEBOP Spec Sheet — 목업 견적용 시방서 제작 툴
   - 모든 처리는 브라우저 안에서만 이루어집니다 (서버 전송 없음)
   ========================================================= */

// ---------- utils ----------
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
function todayStr(){ const d = new Date(); return `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`; }
function el(tag, props, ...kids){

// ordering by hand: click parts on the image (or their markers) as 1, 2, 3…; specs stay with each part
function startOrder(p){ ui.ordering = { pid: p.id, seq: [] }; ui.tool = 'order'; ui.selPart = null; ui.sel.clear(); renderAll(); toast('Click the parts in order, starting with 1'); }

// arrow tip: the point where a ray from the part's center toward the marker leaves the part

// ---------- geometry ----------
function toPg(p, q){ return { x: p.box.x + q.x/p.nw*p.box.w, y: p.box.y + q.y/p.nh*p.box.h }; }

function listTop(p){ return p.title ? 140 : 96; }
function fitDims(p){

  const s = Math.min(aw/p.nw, ah/p.nh), w = p.nw*s, h = p.nh*s;

}
function fitBox(p){ p.box = fitDims(p); }
function scaleCoords(p, f){
  const sp = s => [s[0]*f, s[1]*f], pt2 = q => q && ({ x: q.x*f, y: q.y*f });
  p.objects.forEach(o => { o.cx *= f; o.cy *= f; o.bbox = o.bbox.map(v => v*f); o.samples = o.samples.map(sp); o.area *= f*f; });
  p.manual.forEach(m => { m.x *= f; m.y *= f; });

}

  let c = false;

    const a = poly[i], b = poly[j];
    if (((a.y > y) !== (b.y > y)) && (x < (b.x - a.x)*(y - a.y)/(b.y - a.y) + a.x)) c = !c;

// ---------- knockout (capture background -> transparent) ----------
function cleanKey(p){ return `${p.imageId}|${p.det.bg || p.det.autoBg}|${p.det.tol}`; }
function ensureClean(p){
  const key = cleanKey(p);

  const bg = p.det.bg || p.det.autoBg;
  const pr = getImg(p.imageId).then(img => {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    if (bg){
      const id = x.getImageData(0, 0, c.width, c.height), d = id.data, [r, g, b] = hexToRgb(bg), t = p.det.tol, t0 = t*0.55;
      for (let j = 0; j < d.length; j += 4){ const dd = Math.sqrt((d[j]-r)**2 + (d[j+1]-g)**2 + (d[j+2]-b)**2);
        if (dd < t) d[j+3] = dd <= t0 ? 0 : d[j+3]*(dd - t0)/(t - t0); }
      x.putImageData(id, 0, 0);
    }
    return new Promise(res => c.toBlob(bl => { const u = URL.createObjectURL(bl); cleanReady.set(key, u); res(u); }, 'image/png'));

    ensureClean(p).then(() => { if (curPage() === p) renderPage(); });
  }
  return IMG[p.imageId];
}

async function prepLogo(){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = LOGO_SRC; });
  const W = img.naturalWidth, H = img.naturalHeight, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const id = x.getImageData(0, 0, W, H), d = id.data; let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let i = 0; i < W*H; i++){

    d[j] = d[j+1] = d[j+2] = 0; d[j+3] = a;

  }

  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;

    host.style.setProperty('--ls', ls);

    items.forEach(it => { it.style.width = w + 'px'; });

    const l = pg.querySelector('.pg-list'); if (!l || l.scrollWidth <= l.clientWidth + 2) break;

function applySolo(){

  pg.querySelectorAll('.li').forEach(li => { li.classList.toggle('dim', !!id && li.dataset.part !== id); li.classList.toggle('on', !!id && li.dataset.part === id); });

  const p = curPage(); if (!p || p.type !== 'render' || !p.imageId || !p.nw) return;
  e.preventDefault();
  if (!wheelC){ commit(); wheelC = true; }
  zoomRender(p, (p.zoom || 1)*Math.exp(-e.deltaY*(e.ctrlKey ? 0.01 : 0.0015)), toPage(e));
  const r = renderRect(p), img = $('#pageWrap .rimg');
  if (img) Object.assign(img.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  clearTimeout(wheelT); wheelT = setTimeout(() => { wheelC = false; renderSide(); renderPanel(); }, 250);
}, { passive: false });

// ---------- fullscreen ----------
const pres = { on: false };
function presRender(){
  const w = $('#presWrap'), sc = Math.min(innerWidth/1920, innerHeight/1080);
  w.replaceChildren(buildPage(curPage(), cur, false));
  w.style.transform = `scale(${sc})`; w.style.left = (innerWidth - 1920*sc)/2 + 'px'; w.style.top = (innerHeight - 1080*sc)/2 + 'px';
}
function presGo(d){ const n = clamp(cur + d, 0, S.pages.length - 1); if (n !== cur){ cur = n; presRender(); } }
function presStart(){
  closePop(); pres.on = true; $('#present').hidden = false; presRender();
  const host = $('#present'); if (host.requestFullscreen) host.requestFullscreen().catch(() => {});
}
function presEnd(){
  if (!pres.on) return; pres.on = false; $('#present').hidden = true; $('#presWrap').replaceChildren();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  ui.sel.clear(); ui.selPart = null; ui.selRef = null; renderAll();
}
$('#present').addEventListener('click', e => presGo(e.clientX < innerWidth/3 ? -1 : 1));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) presEnd(); });

// ---------- resizable side bars ----------
const SIDE = { L: { v: '--lw', min: 160, max: 400, def: 220 }, R: { v: '--rw', min: 340, max: 680, def: 390 } };
function setSide(k, w){ const c = SIDE[k]; w = clamp(Math.round(w), c.min, c.max); $('#app').style.setProperty(c.v, w + 'px'); return w; }
for (const k of ['L', 'R']){
  try { const w = +localStorage.getItem('bebop-side-' + k); if (w) setSide(k, w); } catch(e){}
  const h = $('#rz' + k);
  h.addEventListener('pointerdown', e => {
    e.preventDefault(); h.classList.add('on'); document.body.classList.add('resizing');
    let w;
    const mv = ev => { w = setSide(k, k === 'L' ? ev.clientX : innerWidth - ev.clientX); layout(); fitThumbs(); };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); h.classList.remove('on'); document.body.classList.remove('resizing');
      try { if (w) localStorage.setItem('bebop-side-' + k, w); } catch(e){} };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  });
  h.addEventListener('dblclick', () => { setSide(k, SIDE[k].def); layout(); fitThumbs(); try { localStorage.removeItem('bebop-side-' + k); } catch(e){} });
}

// ---------- global events ----------
$('#pageWrap').addEventListener('pointerdown', onDown);
$('#stage').addEventListener('pointerdown', e => {
  if (e.target !== $('#stage')) return;   // only the grey area around the page
  const ae = document.activeElement; if (ae && ae.isContentEditable) ae.blur();
  ui.showDet = false; ui.sel.clear(); ui.selPart = null; renderAll();
});
$('#bNew').onclick = () => { if (!confirm('Start a new document? Unsaved changes will be lost.')) return; freshDoc(); renderAll(); };
$('#bSave').onclick = e => save(e.shiftKey);
$('#bPdf').onclick = printPdf;
$('#bFull').onclick = presStart;
window.addEventListener('resize', () => { layout(); fitThumbs(); if (pres.on) presRender(); });
const stage = $('#stage');
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => {
  e.preventDefault();
  const js = [...e.dataTransfer.files].find(f => /\.json$/i.test(f.name));
  if (js){ js.text().then(t => { loadDoc(JSON.parse(t)); fileHandle = null; renderAll(); toast('Opened · ' + js.name); }).catch(err => toast('Could not open: ' + err.message)); return; }
  const fs = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')); if (!fs.length) return;
  const p = curPage();
  if (p.type === 'spec') setCapture(p, fs[0]); else if (p.type === 'render') setRenderImg(p, fs[0]); else addRenderPages(fs);
});
document.addEventListener('paste', e => {
  const ae = document.activeElement, tag = ae && ae.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || (ae && ae.isContentEditable)) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/')); if (!item) return;
  const f = item.getAsFile(), p = curPage(); e.preventDefault();
  if (p.type === 'spec') setCapture(p, f); else if (p.type === 'render') setRenderImg(p, f); else addRenderPages([f]);
});
document.addEventListener('keydown', e => {
  const ae = document.activeElement, tag = ae && ae.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (ae && ae.isContentEditable);
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (k === 'escape' && !$('#pop').hidden){ closePop(); return; }
  if (pres.on){
    if (['arrowright', 'arrowdown', 'pagedown', ' ', 'enter'].includes(k)){ e.preventDefault(); presGo(1); }
    else if (['arrowleft', 'arrowup', 'pageup', 'backspace'].includes(k)){ e.preventDefault(); presGo(-1); }
    else if (k === 'escape'){ presEnd(); }
    return;
  }
  if (k === 'f' && !mod && !typing){ presStart(); return; }
  if (mod && k === 's'){ e.preventDefault(); save(e.shiftKey); return; }
  if (mod && k === 'o'){ e.preventDefault(); openDoc(); return; }
  if (mod && (k === 'z' || k === 'y')){ if (typing) return; e.preventDefault(); (k === 'y' || e.shiftKey) ? redo() : undo(); return; }
  if (typing || mod) return;
  const p = curPage(); if (!p || p.type !== 'spec') return;
  if (k === 'v') setTool('select'); else if (k === 'w' || k === 'l') setTool('brush'); else if (k === 'm') setTool('move');
  else if (k === '[' || k === ']'){ ui.brush = clamp((ui.brush || 10) + (k === ']' ? 3 : -3), 3, 60); toast('Brush size ' + ui.brush); }
  else if (k === 'g') groupSel();
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); if (ui.sel.size) excludeSel(); else if (ui.selPart) deletePart(p, ui.selPart); }
  else if (k === 'escape'){ if (ui.ordering){ finishOrder(false); return; } ui.sel.clear(); ui.selPart = null; ui.selRef = null; if (ui.tool === 'add') ui.tool = 'select'; renderAll(); }
});

// ---------- boot ----------
(async function boot(){
  freshDoc();
  try { await prepLogo(); } catch(e){}
  try {
    const d = await idb.get('draft');
    if (d){ loadDoc(JSON.parse(d)); setTimeout(() => toast('Restored your last session', [['Start new', () => { freshDoc(); renderAll(); }]]), 300); }
  } catch(e){ freshDoc(); }
  layout(); renderAll();
  try { await document.fonts.ready; renderAll(); } catch(e){}
})();
</script>
</body>
